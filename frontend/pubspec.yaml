name: cashewcare
description: CashewCare – AI-Powered Cashew Leaf Disease Detection
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: ^5.4.3
  http: ^1.2.1

  # State Management
  provider: ^6.1.2

  # Storage & Persistence
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Charts
  fl_chart: ^0.68.0

  # UI & Animations
  shimmer: ^3.0.0
  lottie: ^3.1.2
  animate_do: ^3.3.4

  # On-device AI
  tflite_flutter: ^0.12.1
  image: ^4.1.7

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  permission_handler: ^11.3.1

  # Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
